apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: martino-todo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: todo-app

  template:
    metadata:
      labels:
        app: todo-app

    spec:
      containers:
        - name: todo-app

          image: ghcr.io/TVUJ_GITHUB/todo-app:latest

          ports:
            - containerPort: 8009

          env:
            - name: DATABASE_PATH
              value: /data/todo.db

          volumeMounts:
            - name: todo-storage
              mountPath: /data

          readinessProbe:
            httpGet:
              path: /
              port: 8009
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8009
            initialDelaySeconds: 15
            periodSeconds: 20

      volumes:
        - name: todo-storage
          persistentVolumeClaim:
            claimName: todo-pvc

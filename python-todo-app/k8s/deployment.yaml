apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-todo-app
  namespace: martino

spec:
  replicas: 1

  selector:
    matchLabels:
      app: python-todo-app

  template:
    metadata:
      labels:
        app: python-todo-app

    spec:
      containers:
        - name: python-todo-app

          image: ghcr.io/tarkanj/python-todo-app:latest

          ports:
            - containerPort: 8009

          env:
            - name: DATABASE_PATH
              value: /data/todo.db

          volumeMounts:
            - name: python-todo-storage
              mountPath: /data

          readinessProbe:
            httpGet:
              path: /
              port: 8009
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8009
            initialDelaySeconds: 15
            periodSeconds: 20

      volumes:
        - name: python-todo-storage
          persistentVolumeClaim:
            claimName: python-todo-pvc
